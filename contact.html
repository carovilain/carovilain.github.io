<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Caro Vilain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css">
</head>
<body>



<header class="site-header">
  <a class="wordmark" href="index.html">Caro Vilain</a>
  
  <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <span class="hamburger"></span>
  </button>

  <nav id="site-nav" aria-label="Main">
    <a href="index.html">About</a>
    <a href="portfolio.html">Work</a>
    <a href="appearances.html">Appearances</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <!-- The one moving circle -->
  <div class="circle-teal">
    <div class="circle-green">
      <div class="circle-yellow">
        <a class="email-button" href="mailto:contact@carovilain.com">
          <span>contact@</span><span>carovilain.com</span>

<footer class="site-footer">

  <span>
    <a href="mailto:contact@carovilain.com">Email</a>

  </span>
</footer>
<script>
  const navToggle = document.querySelector('.nav-toggle');
  const siteNav = document.getElementById('site-nav');

  navToggle.addEventListener('click', () => {
    const isOpen = navToggle.getAttribute('aria-expanded') === 'true';
    navToggle.setAttribute('aria-expanded', !isOpen);
    siteNav.classList.toggle('nav-open');
  });
</script>
</body>
</html>
